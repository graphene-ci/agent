name: release

# A pushed semver tag (X.Y.Z) ships the graphene-agent binaries to a
# GitHub Release. Tag the agent BEFORE graphene: graphene's server image
# embeds the agent of the same tag (lockstep).
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    name: graphene-agent (goreleaser)
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag is semver
        run: |
          set -euo pipefail
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must be a Go module version vX.Y.Z; got: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
