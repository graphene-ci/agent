version: "2"
run:
  go: "1.25"
output:
  formats:
    text:
      path: stdout
linters:
  exclusions:
    rules:
      # Decommission runs the uninstall script the authenticated server
      # sent over the agent's own session — executing it is the command's
      # purpose; the server is the agent's root of trust.
      - path: internal/session/decommission\.go
        linters: [gosec]
        text: 'G204:'
  default: standard
  enable:
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - staticcheck
  settings:
    revive:
      rules:
        # Repository convention: identifier suffix is "Id" (matches the
        # protobuf id-message convention), not Go's default "ID".
        - name: var-naming
          arguments:
            - ["ID"]
            - []
